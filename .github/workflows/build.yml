name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        run: unzip -q '*.zip'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unduh WORLD vocoder
        run: git clone --depth 1 https://github.com/mmorise/World.git SuaraKu/app/src/main/cpp/World

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: SuaraKu
        run: |
          if ! gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1; then
            echo "===== PENYEBAB ERROR ====="
            grep -A 12 "What went wrong" build.log | head -50
            echo "===== BARIS ERROR KODE ====="
            grep -E "^e: |error:|FAILED|Unresolved|not found" build.log | head -40
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SuaraKu-debug-apk
          path: SuaraKu/app/build/outputs/apk/debug/*.apk
